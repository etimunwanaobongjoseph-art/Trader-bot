name: Build Neuraxon APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'NeuraxonAndroid-Source.zip'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract Android project
        run: |
          unzip -q NeuraxonAndroid-Source.zip -d .
          test -f NeuraxonAndroid/app/build.gradle
      - name: Build debug APK
        run: gradle -p NeuraxonAndroid assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: neuraxon-debug-apk
          path: NeuraxonAndroid/app/build/outputs/apk/debug/app-debug.apk
